name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  PROJECT_PATH: /opt/apps/glass-ui

jobs:
  deploy-storybook:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Deploy Storybook to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ env.PROJECT_PATH }}
            git fetch origin main
            git reset --hard origin/main
            
            # Install dependencies and build Storybook
            pnpm install --frozen-lockfile
            pnpm build:storybook
            
            echo "✅ Storybook deployment complete!"

      # Alternative: Use rsync for faster deployment (upload pre-built files)
      # Uncomment below and comment out the ssh-action above if preferred
      
