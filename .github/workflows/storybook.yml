name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: deploy-storybook
  cancel-in-progress: false

env:
  PROJECT_PATH: /opt/apps/glass-ui

jobs:
  deploy-storybook:
    runs-on: ubuntu-latest

    steps:
      # The server builds the image itself (see Dockerfile), so nothing is built here.
      - name: Deploy Storybook to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            cd ${{ env.PROJECT_PATH }}
            git fetch origin
            git reset --hard ${{ github.sha }}

            docker network create proxy-network 2>/dev/null || true
            docker compose build
            docker compose up -d
            docker image prune -f

            # Storybook must answer before the job counts as deployed
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:8081/; then
                echo "✅ Storybook deployed at ${{ github.sha }}"
                exit 0
              fi
              sleep 2
            done
            echo "❌ Storybook did not answer on :8081"
            docker compose logs --tail 50
            exit 1
