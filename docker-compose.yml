version: '3.8'

services:
  glass-ui:
    build: .
    container_name: glass-ui-storybook
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - glass-ui-network
      # Nginx Proxy Manager reaches the container here for glass-ui.mawtechsolutions.com
      - proxy-network

networks:
  glass-ui-network:
    driver: bridge
  proxy-network:
    external: true
